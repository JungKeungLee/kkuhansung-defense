<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>꾸한성 길막 디펜스</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app"><header class="top"><div class="brand">🏰 꾸한성 <span>길막 디펜스</span></div><div class="stats"><div>웨이브 <strong id="wave">1 / 50</strong></div><div>꾸한성 <strong id="hp">2000 / 2000</strong><div class="meter"><div id="hp-fill"></div></div></div><div>골드 <strong id="gold">500 G</strong></div><div>자동수입 <strong id="income">+2 G/s</strong></div><div>남은 적 <strong id="enemies">0</strong></div><div class="phase-stat"><span id="stage-label">준비 단계</span><strong id="timer">30초</strong></div><div class="dir-stat">출현 방향<strong id="directions">확인 중</strong></div></div></header>
<main><section class="board-side"><div id="board-wrap"><canvas id="game" width="1280" height="800"></canvas><div id="overlay" class="overlay hidden"></div></div><div class="controls"><div class="tools"><button id="tool-wall" class="tool active" data-tool="wall">🧱 벽 설치 <kbd>W</kbd></button><button id="tool-sell" class="tool" data-tool="sell">💰 판매 <kbd>X</kbd></button><button id="tool-inspect" class="tool" data-tool="inspect">🔎 정보 <kbd>Esc</kbd></button><button id="draw-quick">🎲 랜덤 뽑기 <kbd>R</kbd></button><label><input type="checkbox" id="show-path" checked> 경로·분석 표시</label></div><div class="game-actions"><button id="start-wave" class="primary">▶ 전투 시작</button><button id="pause">⏸ 일시정지</button><button class="speed active" data-speed="1">1×</button><button class="speed" data-speed="2">2×</button><button class="speed" data-speed="3">3×</button></div></div><div class="status" id="message">게임 시작! 벽으로 몬스터가 돌아갈 길을 만들고 챔피언을 소환하세요.</div></section>
<aside><div class="tabs"><button data-tab="champions" class="selected">챔피언</button><button data-tab="upgrades">강화</button><button data-tab="castle">회복</button><button data-tab="help">정보</button></div><div id="panel"></div></aside></main><footer>PC 전용 · 32×20 · 기본 벽 제거 불가 · 벽만 이동 차단 · 챔피언 10종 · 무제한 소환 · 50웨이브 <span id="seed"></span></footer></div>
<script defer src="js/config.js"></script><script defer src="js/core.js"></script><script defer src="js/pathfinding.js"></script><script defer src="js/map.js"></script><script defer src="js/game-state.js"></script><script defer src="js/economy.js"></script><script defer src="js/champions.js"></script><script defer src="js/building.js"></script><script defer src="js/healing.js"></script><script defer src="js/waves.js"></script><script defer src="js/monsters.js"></script><script defer src="js/combat.js"></script><script defer src="js/construction.js"></script><script defer src="js/loop.js"></script><script defer src="js/ui.js"></script><script defer src="js/renderer.js"></script><script defer src="js/input.js"></script><script defer src="js/main.js"></script></body></html>
